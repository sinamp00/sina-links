name: Sync Struggle channel latest post

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest channel post
        run: python3 .github/scripts/sync_channel.py

      - name: Commit if changed
        run: |
          git config user.name "sina-links-sync"
          git config user.email "sina-links-sync@users.noreply.github.com"
          git add channel.json
          git diff --cached --quiet || (git commit -m "Sync latest Struggle channel post" && git push)
