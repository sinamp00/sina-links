<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#050507" />
  <link rel="icon" href="profile.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Unbounded:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="preload" href="blockkids.mp3" as="audio" />

  <meta property="og:title" content="SıNa" />
  <meta property="og:description" content="SıNa — links" />
  <meta property="og:image" content="https://sinamp00.github.io/sina-links/profile.jpg" />

  <title>SıNa</title>

  <style>
    :root {
      --accent: #8c78ff;
      --accent-soft: rgba(140, 120, 255, 0.35);
      --text: #f4f4f7;
      --text-dim: #a9a9b4;
      --glass: rgba(255, 255, 255, 0.06);
      --glass-border: rgba(255, 255, 255, 0.12);
      --display: 'Unbounded', 'Poppins', sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body { height: 100%; overflow: hidden; }

    body {
      font-family: 'Poppins', system-ui, sans-serif;
      background: #050507;
      color: var(--text);
      height: 100dvh;
      overscroll-behavior: none;
    }

    /* ---------- Background video ---------- */
    .bg-video {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -3;
      filter: saturate(1.15);
    }

    .bg-overlay {
      position: fixed;
      inset: 0;
      z-index: -2;
      background:
        radial-gradient(ellipse at 50% 18%, rgba(24, 18, 48, 0.32) 0%, transparent 58%),
        linear-gradient(180deg, rgba(5, 5, 8, 0.68) 0%, rgba(5, 5, 8, 0.52) 42%, rgba(5, 5, 8, 0.82) 100%);
    }

    /* film grain for premium texture */
    .grain {
      position: fixed;
      inset: 0;
      z-index: 40;
      pointer-events: none;
      opacity: 0.055;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    /* ---------- Entry overlay (tap to enter -> autoplay) ---------- */
    .enter {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      background: rgba(5, 5, 8, 0.6);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      transition: opacity 0.7s ease, visibility 0.7s;
      cursor: pointer;
      padding: 24px;
      text-align: center;
    }

    .enter.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

    .enter img {
      width: 92px; height: 92px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--glass-border);
      box-shadow: 0 0 34px var(--accent-soft);
      animation: floaty 4s ease-in-out infinite;
    }

    @keyframes floaty {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .enter h2 {
      font-family: var(--display);
      font-size: clamp(24px, 6.5vw, 30px);
      font-weight: 700;
      letter-spacing: 2px;
      background: linear-gradient(180deg, #ffffff 30%, #b9b3ff 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .enter-btn {
      position: relative;
      margin-top: 4px;
      padding: 16px 58px;
      border-radius: 999px;
      border: 1px solid var(--accent-soft);
      background: linear-gradient(135deg, rgba(140, 120, 255, 0.22), rgba(108, 92, 231, 0.12));
      color: var(--text);
      font-family: var(--display);
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 5px;
      cursor: pointer;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      box-shadow: 0 8px 30px rgba(140, 120, 255, 0.25);
    }

    .enter-btn::after {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: 999px;
      border: 1px solid var(--accent);
      opacity: 0.7;
      animation: pulse 2s ease-out infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.7; }
      100% { transform: scale(1.28); opacity: 0; }
    }

    .enter-btn:active { transform: scale(0.95); }
    .enter small { color: var(--text-dim); font-size: 11px; letter-spacing: 2px; font-weight: 300; }

    /* ---------- Main layout: everything fits, no scroll ---------- */
    .page {
      height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding:
        calc(14px + env(safe-area-inset-top)) 20px
        calc(14px + env(safe-area-inset-bottom));
    }

    .card {
      width: 100%;
      max-width: 400px;
      height: 100%;
      max-height: 860px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(8px, 1.7vh, 16px);
    }

    .card > * {
      animation: rise 0.75s cubic-bezier(0.22, 1, 0.36, 1) both;
      animation-delay: var(--d, 0s);
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(22px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .avatar {
      --d: 0s;
      width: clamp(84px, 21vw, 100px);
      height: clamp(84px, 21vw, 100px);
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid rgba(255, 255, 255, 0.16);
      box-shadow: 0 0 44px var(--accent-soft), 0 10px 30px rgba(0, 0, 0, 0.55);
      transition: transform 0.35s ease;
    }

    .avatar:hover { transform: scale(1.05); }

    .name-wrap { --d: 0.08s; text-align: center; }

    h1 {
      font-family: var(--display);
      font-size: clamp(25px, 7vw, 31px);
      font-weight: 800;
      letter-spacing: 2px;
      background: linear-gradient(180deg, #ffffff 25%, #b9b3ff 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 2px 22px rgba(140, 120, 255, 0.45));
    }

    .handle {
      font-size: 12px;
      font-weight: 300;
      color: var(--text-dim);
      margin-top: 5px;
      letter-spacing: 2.5px;
    }

    /* ---------- Player ---------- */
    .player {
      --d: 0.16s;
      width: 100%;
      border-radius: 22px;
      background: linear-gradient(135deg, rgba(255,255,255,0.09), rgba(255,255,255,0.03));
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 14px 16px 12px;
      box-shadow: 0 16px 44px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      position: relative;
      overflow: hidden;
    }

    .player::before {
      content: '';
      position: absolute;
      top: 0; left: 10%; right: 10%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(140, 120, 255, 0.6), transparent);
    }

    .player-top { display: flex; align-items: center; gap: 13px; }

    .cover {
      width: 54px; height: 54px;
      border-radius: 14px;
      object-fit: cover;
      flex-shrink: 0;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.55);
      transition: border-radius 0.5s ease, box-shadow 0.5s ease;
    }

    /* vinyl effect while playing */
    .playing .cover {
      border-radius: 50%;
      animation: spin 9s linear infinite;
      box-shadow: 0 0 22px rgba(140, 120, 255, 0.5);
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .track-meta { flex: 1; min-width: 0; text-align: left; }
    .track-title { font-size: 14px; font-weight: 600; letter-spacing: 0.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .track-artist { font-size: 11px; font-weight: 300; color: var(--text-dim); letter-spacing: 1.8px; margin-top: 3px; }

    .eq { display: inline-flex; align-items: flex-end; gap: 3px; height: 16px; margin-left: 8px; vertical-align: middle; }
    .eq span { width: 3px; background: var(--accent); border-radius: 2px; height: 35%; transition: height 0.3s; }
    .playing .eq span { animation: eq 0.9s ease-in-out infinite; }
    .eq span:nth-child(2) { animation-delay: 0.15s !important; }
    .eq span:nth-child(3) { animation-delay: 0.3s !important; }
    .eq span:nth-child(4) { animation-delay: 0.45s !important; }
    @keyframes eq {
      0%, 100% { height: 30%; }
      50% { height: 100%; }
    }

    .play-btn {
      width: 50px; height: 50px;
      border-radius: 50%;
      border: none;
      flex-shrink: 0;
      background: linear-gradient(135deg, #9a86ff, #6c5ce7);
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 22px rgba(140, 120, 255, 0.5);
      transition: transform 0.2s ease, box-shadow 0.25s ease;
      position: relative;
    }

    .playing .play-btn { animation: glowPulse 2.4s ease-in-out infinite; }

    @keyframes glowPulse {
      0%, 100% { box-shadow: 0 6px 22px rgba(140, 120, 255, 0.5); }
      50% { box-shadow: 0 6px 34px rgba(140, 120, 255, 0.85); }
    }

    .play-btn:active { transform: scale(0.9); }
    .play-btn svg { width: 21px; height: 21px; }
    .play-btn .icon-pause { display: none; }
    .playing .play-btn .icon-play { display: none; }
    .playing .play-btn .icon-pause { display: block; }

    .progress-wrap { margin-top: 12px; }
    .progress {
      height: 5px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.14);
      cursor: pointer;
      position: relative;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, #9a86ff, #6c5ce7);
      box-shadow: 0 0 12px rgba(140, 120, 255, 0.55);
      position: relative;
    }
    .progress-fill::after {
      content: '';
      position: absolute;
      right: -6px; top: 50%;
      width: 12px; height: 12px;
      border-radius: 50%;
      background: #fff;
      transform: translateY(-50%);
      box-shadow: 0 0 10px rgba(140, 120, 255, 0.9);
      opacity: 0;
      transition: opacity 0.2s;
    }
    .progress:active .progress-fill::after { opacity: 1; }

    .time-row {
      display: flex;
      justify-content: space-between;
      margin-top: 7px;
      font-size: 10px;
      font-weight: 300;
      color: var(--text-dim);
      letter-spacing: 1px;
      font-variant-numeric: tabular-nums;
    }

    /* ---------- Links ---------- */
    .links {
      --d: 0.24s;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .link-btn {
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 12px 16px;
      border-radius: 18px;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.09), rgba(255, 255, 255, 0.03));
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      color: var(--text);
      text-decoration: none;
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 0.5px;
      transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.3s ease;
    }

    .link-btn::before {
      content: '';
      position: absolute;
      top: 0; left: -80%;
      width: 60%; height: 100%;
      background: linear-gradient(105deg, transparent, rgba(255, 255, 255, 0.16), transparent);
      transform: skewX(-20deg);
      transition: left 0.6s ease;
      pointer-events: none;
    }

    .link-btn:hover::before, .link-btn:active::before { left: 130%; }
    .link-btn:hover, .link-btn:active { transform: translateY(-3px) scale(1.01); }

    .link-icon {
      width: 44px; height: 44px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: #fff;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.25);
      transition: transform 0.3s ease;
    }

    .link-btn:hover .link-icon { transform: scale(1.08) rotate(-4deg); }
    .link-icon svg { width: 21px; height: 21px; }

    .btn-ig .link-icon { background: linear-gradient(45deg, #f9ce34, #ee2a7b, #6228d7); }
    .btn-ig:hover, .btn-ig:active {
      border-color: rgba(238, 42, 123, 0.5);
      box-shadow: 0 14px 34px rgba(0, 0, 0, 0.5), 0 0 28px rgba(238, 42, 123, 0.28);
    }

    .btn-tg .link-icon { background: linear-gradient(135deg, #37aee2, #1e96c8); }
    .btn-tg:hover, .btn-tg:active {
      border-color: rgba(55, 174, 226, 0.5);
      box-shadow: 0 14px 34px rgba(0, 0, 0, 0.5), 0 0 28px rgba(55, 174, 226, 0.3);
    }

    .btn-ch .link-icon { background: linear-gradient(135deg, #9a86ff, #6c5ce7); }
    .btn-ch:hover, .btn-ch:active {
      border-color: rgba(140, 120, 255, 0.55);
      box-shadow: 0 14px 34px rgba(0, 0, 0, 0.5), 0 0 28px rgba(140, 120, 255, 0.3);
    }

    .link-sub { display: block; font-size: 11px; font-weight: 300; color: var(--text-dim); letter-spacing: 0.5px; margin-top: 1px; }
    .link-btn .chev { margin-left: auto; color: var(--text-dim); font-size: 20px; font-weight: 300; transition: transform 0.25s ease, color 0.25s ease; }
    .link-btn:hover .chev { transform: translateX(4px); color: var(--text); }

    /* ---------- Visitor counter ---------- */
    .visits {
      --d: 0.34s;
      display: none;
      align-items: center;
      gap: 9px;
      padding: 8px 18px;
      border-radius: 999px;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      font-size: 12px;
      font-weight: 300;
      letter-spacing: 1.5px;
      color: var(--text-dim);
    }

    .visits.show { display: inline-flex; }
    .visits svg { width: 16px; height: 16px; color: var(--accent); }
    .visits b { color: var(--text); font-weight: 500; font-variant-numeric: tabular-nums; }

    .footer {
      --d: 0.42s;
      font-family: var(--display);
      font-size: 9px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.32);
      letter-spacing: 6px;
    }

    /* short screens: shrink further so nothing scrolls */
    @media (max-height: 700px) {
      .avatar { width: 72px; height: 72px; }
      h1 { font-size: 22px; }
      .card { gap: 8px; }
      .link-btn { padding: 10px 14px; }
      .link-icon { width: 38px; height: 38px; }
      .cover { width: 46px; height: 46px; }
      .play-btn { width: 44px; height: 44px; }
    }
  </style>
</head>
<body>

  <video class="bg-video" autoplay muted loop playsinline preload="auto" poster="profile.jpg">
    <source src="bg.mp4" type="video/mp4" />
  </video>
  <div class="bg-overlay"></div>
  <div class="grain"></div>

  <!-- Tap-to-enter: enables autoplay with sound -->
  <div class="enter" id="enter">
    <img src="profile.jpg" alt="SıNa" />
    <h2>SıNa</h2>
    <button class="enter-btn" id="enterBtn">ENTER</button>
    <small>TAP TO ENTER WITH SOUND</small>
  </div>

  <main class="page">
    <div class="card">

      <img class="avatar" src="profile.jpg" alt="SıNa" />

      <div class="name-wrap">
        <h1>SıNa</h1>
        <p class="handle">@sinamp606</p>
      </div>

      <div class="player" id="player">
        <div class="player-top">
          <img class="cover" src="cover.jpg" alt="BLOCKKIDS cover" />
          <div class="track-meta">
            <div class="track-title">BLOCKKIDS<span class="eq"><span></span><span></span><span></span><span></span></span></div>

          </div>
          <button class="play-btn" id="playBtn" aria-label="Play / pause">
            <svg class="icon-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.14v13.72c0 .8.87 1.3 1.56.88l10.5-6.86a1.03 1.03 0 0 0 0-1.76L9.56 4.26A1.03 1.03 0 0 0 8 5.14z"/></svg>
            <svg class="icon-pause" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1.2"/><rect x="14" y="4" width="4" height="16" rx="1.2"/></svg>
          </button>
        </div>
        <div class="progress-wrap">
          <div class="progress" id="progress">

      <div class="links">

          <span class="link-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg>
          </span>
          <span>Instagram<span class="link-sub">@sinamp606</span></span>
          <span class="chev">›</span>
        </a>
        <a class="link-btn btn-tg" href="https://t.me/offdbit" target="_blank" rel="noopener">
          <span class="link-icon">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/></svg>
          </span>
          <span>Telegram<span class="link-sub">Direct message</span></span>
          <span class="chev">›</span>
        </a>
        <a class="link-btn btn-ch" href="https://t.me/Playlist_mp" target="_blank" rel="noopener">
          <span class="link-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11a9 9 0 0 1 9 9"/><path d="M4 4a16 16 0 0 1 16 16"/><circle cx="5" cy="19" r="1"/></svg>
          </span>
          <span>Channel<span class="link-sub">Playlist_mp</span></span>

      <div class="visits" id="visits">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        <span><b id="visitCount">–</b>&nbsp;visits</span>
      </div>

      <p class="footer">S I N A</p>

    </div>
  </main>

  <script>
    // Animated tab title
    (function () {
      const t = 'SıNa';
      let i = 0;
      setInterval(function () {
        i = (i + 1) % (t.length + 1);
        document.title = t.substring(0, i) || ' ';
      }, 350);
    })();

    // Visitor counter (Abacus - free, no signup)
    (function () {
      const pill = document.getElementById('visits');
      const num = document.getElementById('visitCount');
      fetch('https://abacus.jasoncameron.dev/hit/sina-links/visits')
        .then(function (r) { return r.json(); })
        .then(function (d) {
          if (d && typeof d.value === 'number') {
            num.textContent = d.value.toLocaleString('en-US');
            pill.classList.add('show');
          }
        })
        .catch(function () { /* counter stays hidden */ });
    })();

    const enter = document.getElementById('enter');
    const player = document.getElementById('player');
    const audio = document.getElementById('audio');
    const playBtn = document.getElementById('playBtn');
    const progress = document.getElementById('progress');
    const progressFill = document.getElementById('progressFill');
    const curTime = document.getElementById('curTime');
    const durTime = document.getElementById('durTime');

    function fmt(s) {
      if (!isFinite(s)) return '0:00';
      const m = Math.floor(s / 60);
      const sec = Math.floor(s % 60);
      return m + ':' + String(sec).padStart(2, '0');
    }

    function setPlaying(on) {
      player.classList.toggle('playing', on);
    }

    function play() {
      audio.play().then(function () { setPlaying(true); }).catch(function () { setPlaying(false); });
    }

    function pause() {
      audio.pause();
      setPlaying(false);
    }

    // Tap to enter -> start music automatically
    enter.addEventListener('click', function () {
      enter.classList.add('hidden');
      play();
    });

    playBtn.addEventListener('click', function (e) {
      e.stopPropagation();
      if (audio.paused) play(); else pause();
    });

    audio.addEventListener('timeupdate', function () {
      if (audio.duration) {
        progressFill.style.width = (audio.currentTime / audio.duration * 100) + '%';
      }
      curTime.textContent = fmt(audio.currentTime);
    });

    audio.addEventListener('loadedmetadata', function () {
      durTime.textContent = fmt(audio.duration);
    });

    audio.addEventListener('play', function () { setPlaying(true); });
    audio.addEventListener('pause', function () { setPlaying(false); });

    // Seek
    function seek(e) {
      const rect = progress.getBoundingClientRect();
      const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
      const ratio = Math.min(Math.max(x / rect.width, 0), 1);
      if (audio.duration) audio.currentTime = ratio * audio.duration;
    }
    progress.addEventListener('click', seek);
    progress.addEventListener('touchstart', function (e) { seek(e); }, { passive: true });
  </script>
</body>
</html>
