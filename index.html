  <title>SıNa</title>

  <script>
    // Animated tab title (typing effect)
    document.addEventListener('DOMContentLoaded', function () {
      const originalTitle = 'SıNa';
      let index = 0;
      setInterval(function () {
        index = (index + 1) % (originalTitle.length + 1);
        document.title = originalTitle.substring(0, index) || ' ';
      }, 350);
    });
  </script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Poppins', sans-serif;
      background: radial-gradient(ellipse at 50% 0%, #16161d 0%, #0a0a0e 55%, #050507 100%);
      color: #f2f2f5;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 56px 20px 64px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      text-align: center;
      animation: fadeUp 0.9s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .avatar {
      width: 128px;
      height: 128px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid rgba(255, 255, 255, 0.14);
      box-shadow: 0 0 42px rgba(140, 120, 255, 0.28), 0 8px 28px rgba(0, 0, 0, 0.55);
      transition: transform 0.35s ease, box-shadow 0.35s ease;
    }

    .avatar:hover {
      transform: scale(1.05);
      box-shadow: 0 0 60px rgba(140, 120, 255, 0.45), 0 8px 28px rgba(0, 0, 0, 0.55);
    }

    h1 {
      font-size: 30px;
      font-weight: 600;
      letter-spacing: 2px;
      margin-top: 18px;
    }

    .handle {
      font-size: 14px;
      font-weight: 300;
      color: #9a9aa5;
      margin-top: 4px;
      letter-spacing: 1px;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-top: 34px;
    }

    .link-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 15px 20px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.055);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #f2f2f5;
      text-decoration: none;
      font-size: 16px;
      font-weight: 400;
      letter-spacing: 0.5px;
      backdrop-filter: blur(8px);
      transition: transform 0.25s ease, background 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
    }

    .link-btn:hover {
      transform: translateY(-2px) scale(1.015);
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(140, 120, 255, 0.55);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45), 0 0 22px rgba(140, 120, 255, 0.18);
    }

    .link-btn svg {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
    }

    .player {
      margin-top: 34px;
      border-radius: 18px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.045);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(8px);
    }

    .player-label {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px 16px 10px;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.5px;
      color: #d8d8e0;
    }

    .eq { display: inline-flex; align-items: flex-end; gap: 3px; height: 16px; }
    .eq span { width: 3px; background: #8c78ff; border-radius: 2px; animation: eq 1s ease-in-out infinite; }
    .eq span:nth-child(1) { height: 60%; animation-delay: 0s; }
    .eq span:nth-child(2) { height: 100%; animation-delay: 0.2s; }
    .eq span:nth-child(3) { height: 45%; animation-delay: 0.4s; }
    .eq span:nth-child(4) { height: 80%; animation-delay: 0.1s; }
    @keyframes eq {
      0%, 100% { transform: scaleY(0.6); }
      50% { transform: scaleY(1); }
    }

    .player iframe {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      border: 0;
    }

    .footer {
      margin-top: 36px;
      font-size: 12px;
      font-weight: 300;
      color: #6d6d78;
      letter-spacing: 2px;
    }
  </style>
</head>

      <a class="link-btn" href="https://t.me/Playlist_mp" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11a9 9 0 0 1 9 9"/><path d="M4 4a16 16 0 0 1 16 16"/><circle cx="5" cy="19" r="1"/></svg>

    </div>

    <div class="player">
      <div class="player-label">

  </div>
</body>
</html>
