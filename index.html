<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#050507" />
  <meta name="color-scheme" content="dark" />
  <link rel="icon" href="profile.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="preload" href="blockkids.mp3" as="audio" />

  <meta property="og:title" content="SıNa" />
  <meta property="og:description" content="SıNa — links" />
  <meta property="og:image" content="https://sinamp00.github.io/sina-links/profile.jpg" />

  <title>SıNa</title>

  <style>
    /* ============ tokens ============ */
    :root {
      --ease-out: cubic-bezier(0.23, 1, 0.32, 1);      /* strong ease-out: entrances, presses */
      --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);  /* strong ease-in-out: on-screen movement */
      --accent: #8b7bff;
      --pink: #ec4899;
      --text: #f5f5f8;
      --dim: #a9a9b6;
      --stroke: rgba(255, 255, 255, 0.12);
      --display: 'Syne', 'Space Grotesk', sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html {
      -webkit-text-size-adjust: 100%;
      overscroll-behavior: none;
    }

    body {
      font-family: 'Space Grotesk', system-ui, sans-serif;
      background: #050507;
      color: var(--text);
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
    }

    button, a, [role="button"] { touch-action: manipulation; }
    button, a { user-select: none; -webkit-user-select: none; }

    /* ============ background ============ */
    .bg-video {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -3;
      filter: saturate(1.12);
    }

    .bg-shade {
      position: fixed;
      inset: 0;
      z-index: -2;
      background:
        radial-gradient(120% 60% at 50% 0%, rgba(20, 14, 44, 0.30) 0%, transparent 60%),
        linear-gradient(180deg, rgba(5, 5, 8, 0.62) 0%, rgba(5, 5, 8, 0.44) 40%, rgba(5, 5, 8, 0.86) 100%);
    }

    .grain {
      position: fixed;
      inset: 0;
      z-index: 40;
      pointer-events: none;
      opacity: 0.05;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    /* slow ambient orbs: constant motion -> linear-ish drift, very slow */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(70px);
      pointer-events: none;
      z-index: 0;
      opacity: 0.5;
    }
    .o1 {
      width: 340px; height: 340px; left: -110px; top: 6%;
      background: radial-gradient(circle, rgba(139, 123, 255, 0.32), transparent 70%);
      animation: orb-drift 18s ease-in-out infinite;
    }
    .o2 {
      width: 280px; height: 280px; right: -90px; top: 46%;
      background: radial-gradient(circle, rgba(236, 72, 153, 0.24), transparent 70%);
      animation: orb-drift 22s ease-in-out infinite reverse;
    }
    @keyframes orb-drift {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(48px, -40px) scale(1.1); }
    }

    /* ============ entrance choreography ============
       One-time page entrance (rare/first-time tier): fade + 18px rise,
       600ms strong ease-out, ~80ms stagger between items.
       Starts only after ENTER is tapped (body.entered). */
    .rise {
      opacity: 0;
      transform: translateY(18px);
      transition: opacity 600ms var(--ease-out), transform 600ms var(--ease-out);
      transition-delay: var(--d, 0ms);
    }
    body.entered .rise { opacity: 1; transform: translateY(0); }

    /* ============ tap-to-enter overlay ============ */
    .enter {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      padding: 24px;
      text-align: center;
      cursor: pointer;
      background: rgba(5, 5, 8, 0.66);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      transition: opacity 480ms var(--ease-out), visibility 0s linear 480ms;
    }
    .enter.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

    .enter img {
      width: 96px; height: 96px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid rgba(255, 255, 255, 0.16);
      box-shadow: 0 0 36px rgba(139, 123, 255, 0.4);
    }

    .enter h2 {
      font-family: var(--display);
      font-size: 30px;
      font-weight: 700;
      letter-spacing: 3px;
      background: linear-gradient(180deg, #ffffff 30%, #b9b3ff 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .enter-btn {
      position: relative;
      margin-top: 4px;
      padding: 16px 62px;
      border-radius: 999px;
      border: 1px solid rgba(139, 123, 255, 0.55);
      background: linear-gradient(135deg, rgba(139, 123, 255, 0.24), rgba(108, 92, 231, 0.12));
      color: var(--text);
      font-family: var(--display);
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 6px;
      cursor: pointer;
      box-shadow: 0 8px 30px rgba(139, 123, 255, 0.28);
      transition: transform 160ms var(--ease-out), box-shadow 240ms ease;
    }
    .enter-btn:active { transform: scale(0.96); }
    .enter-btn::after {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: 999px;
      border: 1px solid var(--accent);
      opacity: 0;
      animation: ring 2.4s var(--ease-out) infinite;
      pointer-events: none;
    }
    @keyframes ring {
      0% { transform: scale(1); opacity: 0.6; }
      100% { transform: scale(1.3); opacity: 0; }
    }
    .enter small { color: var(--dim); font-size: 11px; letter-spacing: 2.5px; font-weight: 300; }

    /* ============ main stage: single screen, no scroll ============ */
    .stage {
      height: 100vh;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding:
        calc(16px + env(safe-area-inset-top)) 20px
        calc(16px + env(safe-area-inset-bottom));
    }

    .stack {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    /* ============ hero ============ */
    .hero {
      --d: 40ms;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid rgba(255, 255, 255, 0.16);
      box-shadow: 0 0 42px rgba(139, 123, 255, 0.38), 0 12px 32px rgba(0, 0, 0, 0.5);
    }

    .word {
      font-family: var(--display);
      font-weight: 800;
      font-size: clamp(36px, 10.5vw, 46px);
      letter-spacing: 6px;
      display: inline-flex;
      overflow: hidden;
      padding: 0 4px 8px;
    }
    .ch {
      display: inline-block;
      transform: translateY(115%);
      background: linear-gradient(180deg, #ffffff 30%, #b9b3ff 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 2px 18px rgba(139, 123, 255, 0.35));
      transition: transform 680ms var(--ease-out);
      transition-delay: calc(160ms + var(--i) * 55ms);
    }
    body.entered .ch { transform: translateY(0); }

    .handle {
      font-size: 12px;
      font-weight: 300;
      letter-spacing: 3px;
      color: var(--dim);
    }

    /* ============ player ============ */
    .player {
      --d: 200ms;
      width: 100%;
      border-radius: 22px;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.09), rgba(255, 255, 255, 0.03));
      border: 1px solid var(--stroke);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      padding: 14px 14px 20px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }

    .player-top { display: flex; align-items: center; gap: 12px; }

    .cover {
      width: 52px; height: 52px;
      border-radius: 14px;
      object-fit: cover;
      flex-shrink: 0;
      display: block;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5);
      transition: border-radius 500ms var(--ease-in-out), box-shadow 500ms ease;
    }
    .playing .cover {
      border-radius: 50%;
      animation: spin 9s linear infinite;
      box-shadow: 0 0 18px rgba(236, 72, 153, 0.5);
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .track-meta { flex: 1; min-width: 0; text-align: left; }
    .track-title {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .track-title .marquee-inner { display: inline-block; will-change: transform; }
    .playing .track-title.scroll .marquee-inner {
      animation: marquee var(--marquee-dur, 6s) linear infinite;
    }
    @keyframes marquee {
      0%, 12% { transform: translateX(0); }
      88%, 100% { transform: translateX(var(--scroll-x, -40px)); }
    }

    .track-sub {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 6px;
      font-size: 10px;
      font-weight: 300;
      letter-spacing: 1.6px;
      color: var(--dim);
    }
    .track-time { letter-spacing: 0.5px; font-variant-numeric: tabular-nums; }

    .eq { display: inline-flex; align-items: flex-end; gap: 2.5px; height: 12px; }
    .eq span {
      width: 2.5px;
      border-radius: 2px;
      height: 28%;
      background: linear-gradient(to top, var(--accent), var(--pink));
    }
    .playing .eq span { animation: eq 0.9s ease-in-out infinite; }
    .eq span:nth-child(2) { animation-delay: 0.15s; }
    .eq span:nth-child(3) { animation-delay: 0.3s; }
    .eq span:nth-child(4) { animation-delay: 0.45s; }
    @keyframes eq {
      0%, 100% { height: 28%; }
      50% { height: 100%; }
    }

    .play-btn {
      width: 48px; height: 48px;
      border-radius: 50%;
      border: none;
      flex-shrink: 0;
      background: linear-gradient(135deg, #b388ff, var(--pink));
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 5px 18px rgba(236, 72, 153, 0.45);
      transition: transform 160ms var(--ease-out), box-shadow 240ms ease;
    }
    .play-btn:active { transform: scale(0.92); }
    .playing .play-btn { animation: glow-pulse 2.6s ease-in-out infinite; }
    @keyframes glow-pulse {
      0%, 100% { box-shadow: 0 5px 18px rgba(236, 72, 153, 0.45); }
      50% { box-shadow: 0 5px 30px rgba(236, 72, 153, 0.8); }
    }
    .play-btn svg { width: 19px; height: 19px; }
    .play-btn .icon-pause { display: none; }
    .playing .play-btn .icon-play { display: none; }
    .playing .play-btn .icon-pause { display: block; }

    .progress {
      position: absolute;
      left: 14px; right: 14px; bottom: 8px;
      height: 12px;
      display: flex;
      align-items: center;
      cursor: pointer;
    }
    .progress-track {
      height: 3px;
      width: 100%;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--accent), var(--pink));
      box-shadow: 0 0 8px rgba(236, 72, 153, 0.6);
    }

    /* ============ links ============ */
    .links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .link-btn {
      --tint: rgba(139, 123, 255, 0.10);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 13px 16px;
      border-radius: 20px;
      background:
        linear-gradient(135deg, var(--tint), transparent 62%),
        linear-gradient(135deg, rgba(255, 255, 255, 0.09), rgba(255, 255, 255, 0.03));
      border: 1px solid var(--stroke);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      color: var(--text);
      text-decoration: none;
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 0.5px;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.35);
      transition: transform 160ms var(--ease-out), border-color 200ms ease, box-shadow 240ms ease;
    }
    .link-btn:active { transform: scale(0.98); }

    /* shine sweep: transform-only, no layout */
    .link-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(105deg, transparent 42%, rgba(255, 255, 255, 0.14) 50%, transparent 58%);
      transform: translateX(-130%);
      transition: transform 700ms ease;
      pointer-events: none;
    }

    .link-icon {
      width: 46px; height: 46px;
      border-radius: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: #fff;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.25);
      transition: transform 240ms var(--ease-out);
    }
    .link-icon svg { width: 22px; height: 22px; }

    .link-label { display: flex; flex-direction: column; gap: 2px; }
    .link-sub { font-size: 11px; font-weight: 300; color: var(--dim); letter-spacing: 0.5px; }
    .chev {
      margin-left: auto;
      color: var(--dim);
      font-size: 22px;
      font-weight: 300;
      transition: transform 200ms var(--ease-out), color 200ms ease;
    }

    .btn-ig { --tint: rgba(238, 42, 123, 0.12); --hover-bc: rgba(238, 42, 123, 0.5); --hover-glow: rgba(238, 42, 123, 0.32); }
    .btn-ig .link-icon { background: linear-gradient(45deg, #f9ce34, #ee2a7b, #6228d7); }
    .btn-tg { --tint: rgba(55, 174, 226, 0.12); --hover-bc: rgba(55, 174, 226, 0.5); --hover-glow: rgba(55, 174, 226, 0.35); }
    .btn-tg .link-icon { background: linear-gradient(135deg, #4fc3f7, #1e96c8); }
    .btn-ch { --tint: rgba(255, 45, 45, 0.13); --hover-bc: rgba(255, 59, 59, 0.55); --hover-glow: rgba(255, 45, 45, 0.38); }
    .btn-ch .link-icon { background: linear-gradient(135deg, #ff3b3b, #7a0d0d); }

    /* hover states gated: touch fires false hovers on tap */
    @media (hover: hover) and (pointer: fine) {
      .link-btn:hover { transform: translateY(-2px); border-color: var(--hover-bc); box-shadow: 0 16px 36px rgba(0, 0, 0, 0.5), 0 0 30px var(--hover-glow); }
      .link-btn:hover::before { transform: translateX(130%); }
      .link-btn:hover .link-icon { transform: scale(1.07) rotate(-5deg); }
      .link-btn:hover .chev { transform: translateX(4px); color: var(--text); }
      .play-btn:hover { transform: scale(1.06); }
      .avatar:hover { transform: scale(1.04); }
    }
    .avatar { transition: transform 240ms var(--ease-out); }

    /* ============ visitor pill ============ */
    .visits {
      --d: 440ms;
      display: none;
      align-items: center;
      gap: 10px;
      padding: 9px 20px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      font-size: 10px;
      font-weight: 400;
      letter-spacing: 3px;
      color: rgba(255, 255, 255, 0.65);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }
    .visits.show { display: inline-flex; }
    .visits b {
      font-size: 15px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      color: #fff;
      letter-spacing: 1px;
    }
    .eye { width: 17px; height: 17px; color: #fff; flex-shrink: 0; }
    .eye svg { width: 100%; height: 100%; display: block; }

    .footer {
      --d: 520ms;
      font-family: var(--display);
      font-size: 9px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.32);
      letter-spacing: 6px;
    }

    /* short screens: compact so nothing scrolls */
    @media (max-height: 700px) {
      .avatar { width: 76px; height: 76px; }
      .word { font-size: 32px; }
      .stack { gap: 12px; }
      .link-btn { padding: 11px 14px; }
      .link-icon { width: 40px; height: 40px; }
      .cover { width: 46px; height: 46px; }
      .play-btn { width: 44px; height: 44px; }
    }

    /* reduced motion: keep fades, drop movement */
    @media (prefers-reduced-motion: reduce) {
      .rise { transition-duration: 200ms; transform: none; }
      .ch { transition-duration: 200ms; transform: none; }
      .orb, .enter-btn::after, .playing .cover, .playing .eq span, .playing .play-btn { animation: none; }
      .link-btn::before { display: none; }
    }
  </style>
</head>
<body>

  <video class="bg-video" autoplay muted loop playsinline preload="auto" poster="profile.jpg">
    <source src="bg.mp4" type="video/mp4" />
  </video>
  <div class="bg-shade"></div>
  <div class="grain"></div>
  <div class="orb o1"></div>
  <div class="orb o2"></div>

  <!-- Tap-to-enter: unlocks audio autoplay -->
  <div class="enter" id="enter">
    <img src="profile.jpg" alt="SıNa" />
    <h2>SıNa</h2>
    <button class="enter-btn" id="enterBtn">ENTER</button>
    <small>TAP TO ENTER WITH SOUND</small>
  </div>

  <main class="stage">
    <div class="stack">

      <header class="hero rise">
        <img class="avatar" src="profile.jpg" alt="SıNa" />
        <h1 class="word" aria-label="SıNa"><span class="ch" style="--i:0">S</span><span class="ch" style="--i:1">ı</span><span class="ch" style="--i:2">N</span><span class="ch" style="--i:3">a</span></h1>
        <p class="handle">@sinamp606</p>
      </header>

      <section class="player rise" id="player">
        <div class="player-top">
          <img class="cover" src="cover.jpg" alt="BLOCKKIDS cover" />
          <div class="track-meta">
            <div class="track-title"><span class="marquee-inner">BLOCKKIDS (slowed + reverb)</span></div>
            <div class="track-sub">
              <span class="eq"><span></span><span></span><span></span><span></span></span>
              <span>THIZZY52</span>
              <span class="track-time"><span id="curTime">0:00</span> / <span id="durTime">0:00</span></span>
            </div>
          </div>
          <button class="play-btn" id="playBtn" aria-label="Play / pause">
            <svg class="icon-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.14v13.72c0 .8.87 1.3 1.56.88l10.5-6.86a1.03 1.03 0 0 0 0-1.76L9.56 4.26A1.03 1.03 0 0 0 8 5.14z"/></svg>
            <svg class="icon-pause" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1.2"/><rect x="14" y="4" width="4" height="16" rx="1.2"/></svg>
          </button>
        </div>
        <div class="progress" id="progress">
          <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
        </div>
        <audio id="audio" src="blockkids.mp3" preload="auto" loop></audio>
      </section>

      <nav class="links">
        <a class="link-btn btn-ig rise" style="--d:280ms" href="https://instagram.com/sinamp606" target="_blank" rel="noopener">
          <span class="link-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg>
          </span>
          <span class="link-label">Instagram<span class="link-sub">@sinamp606</span></span>
          <span class="chev">›</span>
        </a>
        <a class="link-btn btn-tg rise" style="--d:360ms" href="https://t.me/offdbit" target="_blank" rel="noopener">
          <span class="link-icon">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/></svg>
          </span>
          <span class="link-label">Telegram<span class="link-sub">Direct message</span></span>
          <span class="chev">›</span>
        </a>
        <a class="link-btn btn-ch rise" style="--d:440ms" href="https://t.me/Playlist_mp" target="_blank" rel="noopener">
          <span class="link-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11a9 9 0 0 1 9 9"/><path d="M4 4a16 16 0 0 1 16 16"/><circle cx="5" cy="19" r="1"/></svg>
          </span>
          <span class="link-label">Struggle<span class="link-sub">t.me/Playlist_mp</span></span>
          <span class="chev">›</span>
        </a>
      </nav>

      <div class="visits rise" id="visits">
        <span class="eye"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></span>
        <span>TOTAL&nbsp;VISITS</span>
        <b id="visitCount">0</b>
      </div>

      <p class="footer rise">S I N A</p>

    </div>
  </main>

  <script>
    // Animated tab title
    (function () {
      const t = 'SıNa';
      let i = 0;
      setInterval(function () {
        i = (i + 1) % (t.length + 1);
        document.title = t.substring(0, i) || ' ';
      }, 350);
    })();

    // Visitor counter (Abacus - free, no signup), animated count-up
    (function () {
      const pill = document.getElementById('visits');
      const num = document.getElementById('visitCount');
      function countUp(target) {
        const dur = 1400, t0 = performance.now();
        function tick(t) {
          const p = Math.min(1, (t - t0) / dur);
          const eased = 1 - Math.pow(1 - p, 3);
          num.textContent = Math.round(target * eased).toLocaleString('en-US');
          if (p < 1) requestAnimationFrame(tick);
        }
        requestAnimationFrame(tick);
      }
      fetch('https://abacus.jasoncameron.dev/hit/sina-links/visits')
        .then(function (r) { return r.json(); })
        .then(function (d) {
          if (d && typeof d.value === 'number') {
            pill.classList.add('show');
            countUp(d.value);
          }
        })
        .catch(function () { /* counter stays hidden */ });
    })();

    const enter = document.getElementById('enter');
    const player = document.getElementById('player');
    const audio = document.getElementById('audio');
    const playBtn = document.getElementById('playBtn');
    const progress = document.getElementById('progress');
    const progressFill = document.getElementById('progressFill');
    const curTime = document.getElementById('curTime');
    const durTime = document.getElementById('durTime');

    function fmt(s) {
      if (!isFinite(s)) return '0:00';
      const m = Math.floor(s / 60);
      const sec = Math.floor(s % 60);
      return m + ':' + String(sec).padStart(2, '0');
    }

    function setPlaying(on) {
      player.classList.toggle('playing', on);
    }

    function play() {
      audio.play().then(function () { setPlaying(true); }).catch(function () { setPlaying(false); });
    }

    function pause() {
      audio.pause();
      setPlaying(false);
    }

    // Tap to enter -> reveal the page (starts entrance choreography) + autoplay music
    enter.addEventListener('click', function () {
      enter.classList.add('hidden');
      document.body.classList.add('entered');
      play();
    });

    playBtn.addEventListener('click', function (e) {
      e.stopPropagation();
      if (audio.paused) play(); else pause();
    });

    // Marquee the track title while playing when it overflows
    const trackTitle = document.querySelector('.track-title');
    const marqueeInner = trackTitle.querySelector('.marquee-inner');
    function fitTitle() {
      const overflow = marqueeInner.scrollWidth - trackTitle.clientWidth;
      if (overflow > 4) {
        trackTitle.classList.add('scroll');
        marqueeInner.style.setProperty('--scroll-x', (-overflow) + 'px');
        marqueeInner.style.setProperty('--marquee-dur', Math.max(4, marqueeInner.scrollWidth / 45) + 's');
      } else {
        trackTitle.classList.remove('scroll');
      }
    }
    window.addEventListener('resize', fitTitle);
    if (document.fonts && document.fonts.ready) { document.fonts.ready.then(fitTitle); }
    fitTitle();

    audio.addEventListener('timeupdate', function () {
      if (audio.duration) {
        progressFill.style.width = (audio.currentTime / audio.duration * 100) + '%';
      }
      curTime.textContent = fmt(audio.currentTime);
    });

    audio.addEventListener('loadedmetadata', function () {
      durTime.textContent = fmt(audio.duration);
    });

    audio.addEventListener('play', function () { setPlaying(true); });
    audio.addEventListener('pause', function () { setPlaying(false); });

    // Seek (click + touch)
    function seek(e) {
      const rect = progress.getBoundingClientRect();
      const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
      const ratio = Math.min(Math.max(x / rect.width, 0), 1);
      if (audio.duration) audio.currentTime = ratio * audio.duration;
    }
    progress.addEventListener('click', seek);
    progress.addEventListener('touchstart', function (e) { seek(e); }, { passive: true });
  </script>
</body>
</html>
